baseURL = 'https://ntnn.de/'
locale = 'en-us'
title = 'ntnn'
theme = 'ntnn'

[menus]

  [[menus.main]]
    name = 'Start'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Tools'
    pageRef = '/tools'
    weight = 20

[server]

  [[server.headers]]
    for = '/tools/**'

    [server.headers.values]
      Cache-Control = 'no-cache'
